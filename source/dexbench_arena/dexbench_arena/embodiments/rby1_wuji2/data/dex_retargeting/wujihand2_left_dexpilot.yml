# DexPilot retargeting config for the LEFT Wuji Hand 2 (wujiv2).
#
# Consumed by isaacteleop's DexHandRetargeter together with
# assets/embodiments/simready/rby1m_wujihand2_beta2/source/urdf/wujihand2_left_retarget.urdf (generated by
# a maintainers' tool; root = left_retarget_base_link,
# the MANO wrist frame the MJCF sites define).
#
# scaling_factor is DERIVED: DexPilot multiplies the operator's
# target vectors by it, so it is |robot hand| / |operator hand| (see the
# RetargetingConfig docstring: "Allegro is 1.6 times larger than normal human
# hand, then this scaling factor should be 1.6"). Measured over exactly the 15
# vectors DexPilot optimises (10 tip-tip pairs + 5 wrist-tip), with DexPilot's
# own loss weights and both hands fully extended, the Wuji Hand 2 is 0.926x the
# Wuji Hand 1, and its 1.25 scales to 1.25 * 0.926 = 1.157. low_pass_alpha is
# pure output smoothing and stays at the shared 0.2 (a feel parameter). Joint
# order is finger-major (thumb, index, middle, ring, pinky x 4 stages),
# matching the retarget URDF chain; semantic correspondence (thumb: CMC flex, CMC
# abd, MCP, IP; fingers: MCP flex, spread, PIP, DIP).
retargeting:
  finger_tip_link_names:
  - left_thumb_tip
  - left_index_finger_tip
  - left_middle_finger_tip
  - left_ring_finger_tip
  - left_pinky_tip
  low_pass_alpha: 0.2
  scaling_factor: 1.157
  target_joint_names:
  - left_thumb_cmc_flex
  - left_thumb_cmc_abd
  - left_thumb_mcp
  - left_thumb_ip
  - left_index_finger_mcp_flex
  - left_index_finger_mcp_abd
  - left_index_finger_pip
  - left_index_finger_dip
  - left_middle_finger_mcp_flex
  - left_middle_finger_mcp_abd
  - left_middle_finger_pip
  - left_middle_finger_dip
  - left_ring_finger_mcp_flex
  - left_ring_finger_mcp_abd
  - left_ring_finger_pip
  - left_ring_finger_dip
  - left_pinky_mcp_flex
  - left_pinky_mcp_abd
  - left_pinky_pip
  - left_pinky_dip
  type: DexPilot
  urdf_path: ""
  wrist_link_name: left_retarget_base_link
