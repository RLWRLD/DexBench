# E4 banquet hall (DB-H1) variation scenarios: three recorded GA-S draws, three
# structural GA-O run parameters (a plate's collider is baked at spawn, so
# diameter and shape are chosen per Run, the way E2 chooses box scales) and the
# recorded lighting draws on the delivered r01 lights. Every Run mounts the
# RBY1-M Wuji2: the stack task and its reset read the robot.
#
#   /isaac-sim/python.sh scripts/evaluation/experiment_runner.py --viz kit \
#       --experiment_config scripts/evaluation/experiment_configs/e4_hotel_fb_variations.yaml
shared:
  environment:
    type: dexbench_hotel_fb_e4_environment
    embodiment: dexbench_rby1_wuji2
    anchor: A_h1
    task: stack_plates
  policy:
    type: zero_action
  rollout_limit:
    num_steps: 30

runs:
  # GA-S 1, through Arena's own base knob: the base re-lands within a square of
  # +-0.20 m about the anchor, recorded as dexbench_rby1_wuji2.base_pose. Press R a
  # few times. Only about 70 mm of that was solved for the two-handed grasp, so
  # expect stances that cannot reach a stack; score reachability separately.
  base_pose:
    environment:
      base_jitter_radius: 0.20

  # GA-S 2/3: both stacks move and turn as units, up to 15 mm and 15 deg, recorded
  # as table_plate_00.source_stack_pose and clearing_plate_00.dest_stack_pose.
  # Check each column stays nested and rim-flush inside its fixture edge.
  source_stack_pose:
    environment:
      stack_jitter_xy: 0.015
      stack_jitter_yaw_deg: 15.0

  # GA-S 2/3 at the containment cap: the draw may carry the near rim past the
  # fixture edge by 30 % of the dish radius (56 mm of jitter on the default
  # plate). Check the source stack does not tip off the table and the destination
  # stack stays inside the success region.
  stack_pose_max:
    environment:
      stack_jitter_xy: 0.056
      stack_jitter_yaw_deg: 15.0

  # GA-O 1, structural: the smallest plate the spec asks for (200 mm). The stacks
  # seed at the scaled nest pitch; check they settle without interpenetrating and
  # that both still sit inside their fixture edge.
  plate_small:
    environment:
      plate_diameter_m: 0.20

  # GA-O 1, structural: the largest (280 mm; its rim then overhangs the 132 mm
  # inset by 8 mm). Check the source stack still clears the table edge and that
  # the destination stack fits the 0.600 m cart side.
  plate_large:
    environment:
      plate_diameter_m: 0.28

  # GA-O 1, structural: shape instead of size, the 162 mm GODMIDDAG bowl, nest
  # pitch 10.78 mm. Check both stacks settle upright.
  plate_bowl:
    environment:
      plate_variant: godmiddag_bowl_16

  # Lighting, relative to the delivery: one brightness factor on every r01
  # light's own intensity (x0.25-1.5) and one colour temperature over every
  # light's own tint (3000-9000 K; 6500 K is the room as delivered), drawn fresh
  # on every rebuild (press N twice to compare). Light positions and count never
  # change, and the delivery's exposure stays on.
  lighting:
    variations:
      dexbench_hotel_fb_e4_lighting.intensity_scale.enabled: true
      dexbench_hotel_fb_e4_lighting.color_temperature.enabled: true
