# DB-H1 (E4 banquet hall, stack_plates at the A_h1 anchor).
# Recording experiment: the Train objects, every draw sampled live. It keeps root alignment and a +-15 mm
# stack jitter, where the spec scores the rim and draws the Train stacks uniform in a 0-3 cm disk. The cells
# replay frozen scenes (benchmark/db_h1_eval_<cell>.yaml, dexbench_arena.benchmark.spec.DB_H1, docs/Eval_Protocol.md).
shared:
  environment:
    type: dexbench_hotel_fb_e4_environment
    embodiment: dexbench_rby1_wuji2_joint
    task: stack_plates
    hide_replay_prims: true  # tablecloth and chandelier hidden; ground collider is invisible
    stack_alignment_point: root  # root alignment, as the header says
    anchor: A_h1
    # Both stacks move and turn as units, recorded as table_plate_00.source_stack_pose and
    # clearing_plate_00.dest_stack_pose: +-15 mm and +-15 deg, inside every dish's containment cap.
    stack_jitter_xy: 0.015
    stack_jitter_yaw_deg: 15.0
    # Base-pose values from a reach check.
    # Training base-pose range: a uniform +-2 cm draw in X and Y, no yaw, recorded
    # as dexbench_rby1_wuji2_joint.base_pose.
    base_jitter_radius: 0.02
  environment_builder:
    # The release runs on Newton; conditions and their evaluation must share the backend.
    presets: NEWTON
  policy:
    # Holds the reset pose (a zero action would drive this embodiment's joints to 0 rad).
    type: dexbench_arena.policy.hold_pose_policy.HoldPosePolicy
  rollout_limit:
    num_episodes: 10

runs:
  harmynta_deep_plate_22:  # T1, 218 mm plate
    environment:
      plate_variant: harmynta_deep_plate_22
  ikea_365_bowl_16:  # T2, 164 mm bowl
    environment:
      plate_variant: ikea_365_bowl_16
  ikea_365_bowl_22:  # T3, 220 mm bowl
    environment:
      plate_variant: ikea_365_bowl_22
