# DB-M2 (E3 manufacturing, insert_connector at A_m2).
# Cell Train (train): training objects, spatial training range.
# Spatial: the plug's tape spot uniform by area in a 4 mm disk about (-8, +8) mm, turned -10 to +20 deg (plug.tape_spot), and the base x, y in [-10, 10] mm, turned +-1 deg: the profile the 240 training demos were collected on.
# Evaluation: each Run (an object at a spatial setting) replays its row file (120 each), frozen rows (each cell's 120 draws stratified over the six coordinates at the Run's seed (spatial_conditions, outcome-blind), as the training set's were at its own placement seeds), through
# environment_builder.recorded_variation_samples_path: one episode per start-state row (120 in the cell),
# at the benchmark cap of 70 s.
# A model runs it with its own policy block (dexbench_arena.benchmark.model_run):
#
#   /isaac-sim/python.sh scripts/evaluation/run_benchmark_cell.py --task m2 --cell train --model <key> \
#       --output outputs/db_m2_eval_train_<key> -- --viz none
#
# Run as it is, the file is the baseline, a pipeline check that is never scored:
#
#   /isaac-sim/python.sh scripts/evaluation/experiment_runner.py --viz none \
#       --experiment_output_directory outputs/db_m2_eval_train_baseline \
#       --experiment_config scripts/evaluation/experiment_configs/benchmark/db_m2_eval_train.yaml
#
# Generated from dexbench_arena.benchmark.spec (DB-M2); edit the spec, not this file.
shared:
  environment:
    type: dexbench_manufacturing_e3_m2_environment
    embodiment: dexbench_rby1_wuji2_joint
    task: insert_connector
    anchor: A_m2
    rby1_control_hz: 30
    arm_mode: dual_arm
    m2_plug_condim: 3
    m2_fingertip_condim: 4
    m2_wire_collision: panel
    m2_wire_rest_spot: [-0.008, 0.008, 0.0872665]
    episode_length_s: 70.0
    benchmark_replay: true
  environment_builder:
    presets: NEWTON
  variations:
    plug:
      tape_spot:
        enabled: true
        sampler_cfg:
          low: [-0.012, 0.004, -0.1745329]
          high: [-0.004, 0.012, 0.3490659]
    dexbench_rby1_wuji2_joint:
      base_pose:
        enabled: true
        sampler_cfg:
          low: [-0.01, -0.01, -0.0174533]
          high: [0.01, 0.01, 0.0174533]
runs:
  s2:
    environment:
      m2_connector: S2
    environment_builder:
      seed: 7759351
      recorded_variation_samples_path: outputs/db_conditions/db_m2_train/s2.jsonl
    policy:
      type: dexbench_arena.policy.hold_pose_policy.HoldPosePolicy
