# DB-M4 (E3 manufacturing, hand_start_leg at A_m4).
# Cell GA-S (ga_s): training objects, spatial beyond the training range.
# Spatial: one station fixed off its training square and the other draws at their training ranges: the leg 15 mm out toward each of e, ne, n, nw, w, sw, s, se; or the cabinet at x +-30 mm, y +-28 mm and the four corners, the widest y its pallet keeps on the worktop (CABINET_STATION_MAX_ABS_XY_M). Every GA-S scene lies outside the training box on the fixed station, by a narrow step: the cabinet 10 mm past its training square in x and 8 mm in y (its worktop's limit), the leg 10 mm on an axis and 8 mm past the square's corner on a diagonal; the cabinet's x and the leg stay this close by choice (their domains allow 250 and 80 mm), so a small Train/GA-S gap is expected.
# Evaluation: each Run (an object at a spatial setting) replays its row file (7 or 8 each, as the spec's row_quotas declare), the filtered rows of db_m4_conditions_ga_s.yaml, through
# environment_builder.recorded_variation_samples_path: one episode per start-state row (120 in the cell),
# at the benchmark cap of 115 s.
# A model runs it with its own policy block (dexbench_arena.benchmark.model_run):
#
#   /isaac-sim/python.sh scripts/evaluation/run_benchmark_cell.py --task m4 --cell ga_s --model <key> \
#       --output outputs/db_m4_eval_ga_s_<key> -- --viz none
#
# Run as it is, the file is the baseline, a pipeline check that is never scored:
#
#   /isaac-sim/python.sh scripts/evaluation/experiment_runner.py --viz none \
#       --experiment_output_directory outputs/db_m4_eval_ga_s_baseline \
#       --experiment_config scripts/evaluation/experiment_configs/benchmark/db_m4_eval_ga_s.yaml
#
# Generated from dexbench_arena.benchmark.spec (DB-M4); edit the spec, not this file.
