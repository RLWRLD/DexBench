# DB-L2 (E2 logistics, lift_to_conveyor at the A1_CAGE anchor) sensitivity sweep, the +alpha robustness section (never in the score).
# Factors, uniform:
#   high_bay_light_01.intensity: x0.25-1.5 of the high-bay's 6302 (DexBenchInteriorLightBase), the high-bay nearest the station, over HB2's infeed end and the cage's front
#   high_bay_light_01.color_temperature: 2700-6500 K
#   high_bay_light_04.intensity: x0.25-1.5, the next nearest, north of the cage
#   high_bay_light_04.color_temperature: 2700-6500 K
#   dexbench_rby1_wuji2_joint.camera_extrinsics_robot_pov_left_cam: head camera translation, +-30 mm per axis, each camera drawn independently
#   dexbench_rby1_wuji2_joint.camera_extrinsics_robot_pov_right_cam: head camera translation, +-30 mm per axis, each camera drawn independently
#   dexbench_rby1_wuji2_joint.camera_extrinsics_wrist_left_cam: palm camera translation, x, y +-5 mm and z (optical axis) 0 to +5 mm, each camera drawn independently
#   dexbench_rby1_wuji2_joint.camera_extrinsics_wrist_right_cam: palm camera translation, x, y +-5 mm and z (optical axis) 0 to +5 mm, each camera drawn independently
# Training-range draws live as in the Train cell. Object: train_0.
# Unavailable at this pin (not swept, not claimed):
#   camera_intrinsics: held by choice: each camera keeps its calibrated intrinsics, which a mount change does not alter (Arena's CameraIntrinsicsVariation exists at the pin)
#   camera_rotation: CameraExtrinsicsVariation draws a translation only at the pin and on Arena main; rotation coordinates are an upstream ask
#   texture: no material or texture variation at the pin or Arena main; the smallest addition is a run-time material-swap variation of ours
#   distractors: the cage boxes carry the box, so removing one is not a distraction
# Note: no scene-wide light factor: E2's twelve lights are separate Arena lights, so the sweep varies the two high-bays nearest the station; a grouped light variation is the smallest addition
#
# Replay: the 200 recorded draws (db_l2_sensitivity_conditions.yaml), one file per build, at the benchmark cap of 25 s.
# Report: isaaclab_arena.analysis.sensitivity.generate_report on the Run's episode_results_rebuild*.jsonl.
# A model runs it with its own policy block (dexbench_arena.benchmark.model_run):
#
#   /isaac-sim/python.sh scripts/evaluation/run_benchmark_cell.py --task l2 --sweep --model <key> \
#       --output outputs/db_l2_sensitivity_<key> -- --viz none
#
# Run as it is, the file is the baseline, a pipeline check that is never scored:
#
#   /isaac-sim/python.sh scripts/evaluation/experiment_runner.py --viz none \
#       --experiment_output_directory outputs/db_l2_sensitivity_baseline \
#       --experiment_config scripts/evaluation/experiment_configs/benchmark/db_l2_sensitivity.yaml
#
# Generated from dexbench_arena.benchmark.spec (DB-L2); edit the spec, not this file.
runs:
  train_0:
    environment:
      type: dexbench_logistics_center_e2_environment
      embodiment: dexbench_rby1_wuji2_joint
      task: lift_to_conveyor
      anchor: A1_CAGE
      rby1_control_hz: 30
      cage_box_alt_scales: [0.85, 1.15]
      base_jitter_radius: 0.0
      newton_num_substeps: 8
      object_box: train_0
      enable_cameras: true
      camera_scale: 0.5
      wrist_cameras: true
      episode_length_s: 25.0
      benchmark_replay: true
    environment_builder:
      presets: NEWTON
      seed: 1016
    policy:
      type: dexbench_arena.policy.hold_pose_policy.HoldPosePolicy
    recorded_variation_samples_paths: [outputs/db_conditions/db_l2_sensitivity/train_0_rebuild0.jsonl, outputs/db_conditions/db_l2_sensitivity/train_0_rebuild1.jsonl,
      outputs/db_conditions/db_l2_sensitivity/train_0_rebuild2.jsonl, outputs/db_conditions/db_l2_sensitivity/train_0_rebuild3.jsonl,
      outputs/db_conditions/db_l2_sensitivity/train_0_rebuild4.jsonl, outputs/db_conditions/db_l2_sensitivity/train_0_rebuild5.jsonl,
      outputs/db_conditions/db_l2_sensitivity/train_0_rebuild6.jsonl, outputs/db_conditions/db_l2_sensitivity/train_0_rebuild7.jsonl,
      outputs/db_conditions/db_l2_sensitivity/train_0_rebuild8.jsonl, outputs/db_conditions/db_l2_sensitivity/train_0_rebuild9.jsonl,
      outputs/db_conditions/db_l2_sensitivity/train_0_rebuild10.jsonl, outputs/db_conditions/db_l2_sensitivity/train_0_rebuild11.jsonl,
      outputs/db_conditions/db_l2_sensitivity/train_0_rebuild12.jsonl, outputs/db_conditions/db_l2_sensitivity/train_0_rebuild13.jsonl,
      outputs/db_conditions/db_l2_sensitivity/train_0_rebuild14.jsonl, outputs/db_conditions/db_l2_sensitivity/train_0_rebuild15.jsonl,
      outputs/db_conditions/db_l2_sensitivity/train_0_rebuild16.jsonl, outputs/db_conditions/db_l2_sensitivity/train_0_rebuild17.jsonl,
      outputs/db_conditions/db_l2_sensitivity/train_0_rebuild18.jsonl, outputs/db_conditions/db_l2_sensitivity/train_0_rebuild19.jsonl]
    variations:
      high_bay_light_01:
        intensity:
          enabled: true
        color_temperature:
          enabled: true
          sampler_cfg:
            low: [2700.0]
            high: [6500.0]
      high_bay_light_04:
        intensity:
          enabled: true
        color_temperature:
          enabled: true
          sampler_cfg:
            low: [2700.0]
            high: [6500.0]
      dexbench_rby1_wuji2_joint:
        camera_extrinsics_robot_pov_left_cam:
          enabled: true
          sampler_cfg:
            low: [-0.03, -0.03, -0.03]
            high: [0.03, 0.03, 0.03]
        camera_extrinsics_robot_pov_right_cam:
          enabled: true
          sampler_cfg:
            low: [-0.03, -0.03, -0.03]
            high: [0.03, 0.03, 0.03]
        camera_extrinsics_wrist_left_cam:
          enabled: true
          sampler_cfg:
            low: [-0.005, -0.005, 0.0]
            high: [0.005, 0.005, 0.005]
        camera_extrinsics_wrist_right_cam:
          enabled: true
          sampler_cfg:
            low: [-0.005, -0.005, 0.0]
            high: [0.005, 0.005, 0.005]
      cage_l2_package:
        cage_stack:
          enabled: true
          sampler_cfg:
            low: [0.0, 0.0, -0.01]
            high: [1.0, 0.08, 0.01]
        pose:
          enabled: true
