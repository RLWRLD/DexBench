# DB-L4 (E2 logistics, deliver_parcels_barcode_up at A_L4 on HB2 and FB1).
# Cell Train (train): training objects, spatial training range, physical training range.
# Spatial: each parcel put down on HB2 at one of its in-domain rotations, drawn per slot at every reset (L4RotationVariation): barcode up, down or to a side, square to the belt (16 for a box, 8 for a bag, e2_logistics_l4_layout.rotation_labels), the rotations the training set's sequences use, each ten times per parcel.
# Physical: each parcel at its nominal mass (boxes 1.0 kg, bags 0.08-0.30 kg as weighed) times an in-domain multiplier, x0.5, x0.71, x1, x1.41 or x2, drawn per slot at every reset (L4MassVariation), the multipliers the training set's sequences use.
# Evaluation: each Run (an object at a spatial setting) replays its row file (10 each), frozen rows (each evaluation sequence's 10 rows at the Run's seed: every slot's rotation and mass multiplier from the cell's domains, stratified over the domain, outcome-blind), through
# environment_builder.recorded_variation_samples_path: one episode per start-state row (120 in the cell),
# at the benchmark cap of 95 s.
# A model runs it with its own policy block (dexbench_arena.benchmark.model_run):
#
#   /isaac-sim/python.sh scripts/evaluation/run_benchmark_cell.py --task l4 --cell train --model <key> \
#       --output outputs/db_l4_eval_train_<key> -- --viz none
#
# Run as it is, the file is the baseline, a pipeline check that is never scored:
#
#   /isaac-sim/python.sh scripts/evaluation/experiment_runner.py --viz none \
#       --experiment_output_directory outputs/db_l4_eval_train_baseline \
#       --experiment_config scripts/evaluation/experiment_configs/benchmark/db_l4_eval_train.yaml
#
# Generated from dexbench_arena.benchmark.spec (DB-L4); edit the spec, not this file.
shared:
  environment:
    type: dexbench_logistics_e2_l4_environment
    embodiment: dexbench_rby1_wuji2_joint
    task: deliver_parcels_barcode_up
    anchor: A_L4
    rby1_control_hz: 30
    belt_speed: 0.45
    end_on_parcel_failure: true
    l4_rotation_draw: id
    l4_mass_draw: id
    episode_length_s: 95.0
    benchmark_replay: true
  environment_builder:
    presets: NEWTON
runs:
