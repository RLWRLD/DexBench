# DB-L3 (E2 logistics, pack_invoice at the A3_BENCH anchor) sensitivity sweep, the +alpha robustness section (never in the score).
# Factors, uniform:
#   task_light_strip_bench.intensity: x0.25-1.5 of the strip under the packing bench's top shelf (1900, DexBenchStripLight)
#   task_light_strip_bench.color_temperature: 2700-6500 K
#   high_bay_light_06.intensity: x0.25-1.5 of the high-bay over the packing bench (6302, DexBenchHighBayLight)
#   high_bay_light_06.color_temperature: 2700-6500 K
#   dexbench_rby1_wuji2_joint.camera_extrinsics_robot_pov_left_cam: head camera translation, +-30 mm per axis, each camera drawn independently
#   dexbench_rby1_wuji2_joint.camera_extrinsics_robot_pov_right_cam: head camera translation, +-30 mm per axis, each camera drawn independently
#   dexbench_rby1_wuji2_joint.camera_extrinsics_wrist_left_cam: palm camera translation, x, y +-5 mm and z (optical axis) 0 to +5 mm, each camera drawn independently
#   dexbench_rby1_wuji2_joint.camera_extrinsics_wrist_right_cam: palm camera translation, x, y +-5 mm and z (optical axis) 0 to +5 mm, each camera drawn independently
# Training-range draws live as in the Train cell. Object: invoice_202x276.
# Unavailable at this pin (not swept, not claimed):
#   camera_intrinsics: held by choice: each camera keeps its calibrated intrinsics, which a mount change does not alter (Arena's CameraIntrinsicsVariation exists at the pin)
#   camera_rotation: CameraExtrinsicsVariation draws a translation only at the pin and on Arena main; rotation coordinates are an upstream ask
#   texture: no material or texture variation at the pin or Arena main; the smallest addition is a run-time material-swap variation of ours
#   distractors: the bench holds the task's pile and box and its fixed fixtures only
#
# Replay: the 200 recorded draws (db_l3_sensitivity_conditions.yaml), one file per build, at the benchmark cap of 25 s.
# Report: isaaclab_arena.analysis.sensitivity.generate_report on the Run's episode_results_rebuild*.jsonl.
# A model runs it with its own policy block (dexbench_arena.benchmark.model_run):
#
#   /isaac-sim/python.sh scripts/evaluation/run_benchmark_cell.py --task l3 --sweep --model <key> \
#       --output outputs/db_l3_sensitivity_<key> -- --viz none
#
# Run as it is, the file is the baseline, a pipeline check that is never scored:
#
#   /isaac-sim/python.sh scripts/evaluation/experiment_runner.py --viz none \
#       --experiment_output_directory outputs/db_l3_sensitivity_baseline \
#       --experiment_config scripts/evaluation/experiment_configs/benchmark/db_l3_sensitivity.yaml
#
# Generated from dexbench_arena.benchmark.spec (DB-L3); edit the spec, not this file.
runs:
  invoice_202x276:
    environment:
      type: dexbench_logistics_center_e2_environment
      embodiment: dexbench_rby1_wuji2_joint
      task: pack_invoice
      anchor: A3_BENCH
      rby1_control_hz: 30
      paper_coupling: one_way_proxy
      paper_hand_colliders: official_hull
      paper_num_sheets: 4
      paper_resolution: 4x6
      paper_substeps: 16
      paper_iterations: 10
      paper_contact_mu: 0.2
      paper_self_contact_radius: 0.002
      invoice_sheet: invoice_202x276
      enable_cameras: true
      camera_scale: 0.5
      wrist_cameras: true
      base_jitter_low: [-0.01, -0.02, -2.5]
      base_jitter_high: [0.02, 0.015, 2.0]
      episode_length_s: 25.0
      benchmark_replay: true
    environment_builder:
      presets: NEWTON
      seed: 1016
    policy:
      type: dexbench_arena.policy.hold_pose_policy.HoldPosePolicy
    recorded_variation_samples_paths: [outputs/db_conditions/db_l3_sensitivity/invoice_202x276_rebuild0.jsonl, outputs/db_conditions/db_l3_sensitivity/invoice_202x276_rebuild1.jsonl,
      outputs/db_conditions/db_l3_sensitivity/invoice_202x276_rebuild2.jsonl, outputs/db_conditions/db_l3_sensitivity/invoice_202x276_rebuild3.jsonl,
      outputs/db_conditions/db_l3_sensitivity/invoice_202x276_rebuild4.jsonl, outputs/db_conditions/db_l3_sensitivity/invoice_202x276_rebuild5.jsonl,
      outputs/db_conditions/db_l3_sensitivity/invoice_202x276_rebuild6.jsonl, outputs/db_conditions/db_l3_sensitivity/invoice_202x276_rebuild7.jsonl,
      outputs/db_conditions/db_l3_sensitivity/invoice_202x276_rebuild8.jsonl, outputs/db_conditions/db_l3_sensitivity/invoice_202x276_rebuild9.jsonl,
      outputs/db_conditions/db_l3_sensitivity/invoice_202x276_rebuild10.jsonl, outputs/db_conditions/db_l3_sensitivity/invoice_202x276_rebuild11.jsonl,
      outputs/db_conditions/db_l3_sensitivity/invoice_202x276_rebuild12.jsonl, outputs/db_conditions/db_l3_sensitivity/invoice_202x276_rebuild13.jsonl,
      outputs/db_conditions/db_l3_sensitivity/invoice_202x276_rebuild14.jsonl, outputs/db_conditions/db_l3_sensitivity/invoice_202x276_rebuild15.jsonl,
      outputs/db_conditions/db_l3_sensitivity/invoice_202x276_rebuild16.jsonl, outputs/db_conditions/db_l3_sensitivity/invoice_202x276_rebuild17.jsonl,
      outputs/db_conditions/db_l3_sensitivity/invoice_202x276_rebuild18.jsonl, outputs/db_conditions/db_l3_sensitivity/invoice_202x276_rebuild19.jsonl]
    variations:
      task_light_strip_bench:
        intensity:
          enabled: true
        color_temperature:
          enabled: true
          sampler_cfg:
            low: [2700.0]
            high: [6500.0]
      high_bay_light_06:
        intensity:
          enabled: true
        color_temperature:
          enabled: true
          sampler_cfg:
            low: [2700.0]
            high: [6500.0]
      dexbench_rby1_wuji2_joint:
        camera_extrinsics_robot_pov_left_cam:
          enabled: true
          sampler_cfg:
            low: [-0.03, -0.03, -0.03]
            high: [0.03, 0.03, 0.03]
        camera_extrinsics_robot_pov_right_cam:
          enabled: true
          sampler_cfg:
            low: [-0.03, -0.03, -0.03]
            high: [0.03, 0.03, 0.03]
        camera_extrinsics_wrist_left_cam:
          enabled: true
          sampler_cfg:
            low: [-0.005, -0.005, 0.0]
            high: [0.005, 0.005, 0.005]
        camera_extrinsics_wrist_right_cam:
          enabled: true
          sampler_cfg:
            low: [-0.005, -0.005, 0.0]
            high: [0.005, 0.005, 0.005]
      packing_bench:
        paper_pile:
          enabled: true
          sampler_cfg:
            low: [-0.02, -0.045, -0.2617994]
            high: [0.06, 0.075, 0.3490659]
        height:
          enabled: true
          sampler_cfg:
            low: [-0.04]
            high: [0.015]
      outbound_box:
        pose:
          enabled: true
          sampler_cfg:
            low: [-0.06, -0.015, -0.0872665]
            high: [0.02, 0.02, 0.2181662]
