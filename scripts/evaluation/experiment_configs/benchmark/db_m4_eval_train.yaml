# DB-M4 (E3 manufacturing, hand_start_leg at A_m4).
# Cell Train (train): training objects, spatial training range.
# Spatial: the base drawn uniformly from the square x, y in [-20, 20] mm, no yaw (dexbench_rby1_wuji2_joint.base_pose), the leg and its holder from x, y in [-5, 5] mm (leg.station_pose), and the cabinet and its pallet from x, y in [-20, 20] mm (base_cabinet.station_pose), nothing turned: db_m4_collect.yaml's range, the draws of every attempt the 240 training demos were kept from.
# Evaluation: each Run (an object at a spatial setting) replays its row file (120 each), the filtered rows of db_m4_conditions_train.yaml, through
# environment_builder.recorded_variation_samples_path: one episode per start-state row (120 in the cell),
# at the benchmark cap of 115 s.
# A model runs it with its own policy block (dexbench_arena.benchmark.model_run):
#
#   /isaac-sim/python.sh scripts/evaluation/run_benchmark_cell.py --task m4 --cell train --model <key> \
#       --output outputs/db_m4_eval_train_<key> -- --viz none
#
# Run as it is, the file is the baseline, a pipeline check that is never scored:
#
#   /isaac-sim/python.sh scripts/evaluation/experiment_runner.py --viz none \
#       --experiment_output_directory outputs/db_m4_eval_train_baseline \
#       --experiment_config scripts/evaluation/experiment_configs/benchmark/db_m4_eval_train.yaml
#
# Generated from dexbench_arena.benchmark.spec (DB-M4); edit the spec, not this file.
shared:
  environment:
    type: dexbench_manufacturing_e3_environment
    embodiment: dexbench_rby1_wuji2_joint
    task: hand_start_leg
    anchor: A_m4
    rby1_control_hz: 30
    episode_length_s: 115.0
    benchmark_replay: true
  environment_builder:
    presets: NEWTON
  variations:
    dexbench_rby1_wuji2_joint:
      base_pose:
        enabled: true
        sampler_cfg:
          low: [-0.02, -0.02, 0.0]
          high: [0.02, 0.02, 0.0]
    leg:
      station_pose:
        enabled: true
        sampler_cfg:
          low: [-0.005, -0.005, 0.0]
          high: [0.005, 0.005, 0.0]
    base_cabinet:
      station_pose:
        enabled: true
        sampler_cfg:
          low: [-0.02, -0.02, 0.0]
          high: [0.02, 0.02, 0.0]
runs:
  lg_fx25_leveling_leg:
    environment:
      m4_leg: lg_fx25_leveling_leg
    environment_builder:
      seed: 9910666
      recorded_variation_samples_path: outputs/db_conditions/db_m4_train/lg_fx25_leveling_leg.jsonl
    policy:
      type: dexbench_arena.policy.hold_pose_policy.HoldPosePolicy
