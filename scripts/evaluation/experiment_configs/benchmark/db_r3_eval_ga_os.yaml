# DB-R3 (retail_v1, place_box_in_slot at the Gondola anchor).
# Cell GA-OS (ga_os): held-out objects, spatial beyond the training range.
# Spatial: one axis fixed off the training range and the other at its training draw: the base 4.5 cm out from the carry layout's base toward each of e, ne, n, nw, w, sw, s, se (base_offset_x/y, yaw re-aimed at the gondola, then turned -1 to +3 deg), the carton drawn +-2 cm; or the carton 4 cm out in the tote toward each of the same eight (box_offset_xy), the base at its training draw; or the base turned 6 deg left at its training x, y draw (base_yaw_p6), or R3_YAW_BEYOND_RIGHT_DEG right with y in [-2, 0] cm (base_yaw_m*), the carton drawn +-2 cm. Every GA-S scene lies outside the training box on the fixed axis. Reach (all 9 cartons) holds at every extreme; reset contact (Newton) clears tote_06 by >= 1 mm at every extreme. Every carton fits the tote.
# Evaluation: each Run (an object at a spatial setting) replays its row file (1 or 2 each, as the spec's row_quotas declare), the filtered rows of db_r3_conditions_ga_os.yaml, through
# environment_builder.recorded_variation_samples_path: one episode per start-state row (120 in the cell),
# at the benchmark cap of 75 s.
# A model runs it with its own policy block (dexbench_arena.benchmark.model_run):
#
#   /isaac-sim/python.sh scripts/evaluation/run_benchmark_cell.py --task r3 --cell ga_os --model <key> \
#       --output outputs/db_r3_eval_ga_os_<key> -- --viz none
#
# Run as it is, the file is the baseline, a pipeline check that is never scored:
#
#   /isaac-sim/python.sh scripts/evaluation/experiment_runner.py --viz none \
#       --experiment_output_directory outputs/db_r3_eval_ga_os_baseline \
#       --experiment_config scripts/evaluation/experiment_configs/benchmark/db_r3_eval_ga_os.yaml
#
