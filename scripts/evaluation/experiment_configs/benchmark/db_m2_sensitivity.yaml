# DB-M2 (E3 manufacturing, insert_connector at A_m2) sensitivity sweep, the +alpha robustness section (never in the score).
# Factors, uniform:
#   dexbench_tube_light.intensity: x0.25-1.5 of the tube's 60000 (DexBenchInteriorLightBase); the room's authored lights stay on
#   dexbench_tube_light.color_temperature: 2700-6500 K
#   dexbench_rby1_wuji2_joint.camera_extrinsics_robot_pov_left_cam: head camera translation, +-30 mm per axis, each camera drawn independently
#   dexbench_rby1_wuji2_joint.camera_extrinsics_robot_pov_right_cam: head camera translation, +-30 mm per axis, each camera drawn independently
#   dexbench_rby1_wuji2_joint.camera_extrinsics_wrist_left_cam: palm camera translation, x, y +-5 mm and z (optical axis) 0 to +5 mm, each camera drawn independently
#   dexbench_rby1_wuji2_joint.camera_extrinsics_wrist_right_cam: palm camera translation, x, y +-5 mm and z (optical axis) 0 to +5 mm, each camera drawn independently
# Training-range draws live as in the Train cell. Object: S2.
# Unavailable at this pin (not swept, not claimed):
#   camera_intrinsics: held by choice: each camera keeps its calibrated intrinsics, which a mount change does not alter (Arena's CameraIntrinsicsVariation exists at the pin)
#   camera_rotation: CameraExtrinsicsVariation draws a translation only at the pin and on Arena main; rotation coordinates are an upstream ask
#   texture: no material or texture variation at the pin or Arena main; the smallest addition is a run-time material-swap variation of ours
#   distractors: the scene holds the liner, its mated neighbour and the task's plug only, each part of the task
#
# Replay: the 200 recorded draws (db_m2_sensitivity_conditions.yaml), one file per build, at the benchmark cap of 70 s.
# Report: isaaclab_arena.analysis.sensitivity.generate_report on the Run's episode_results_rebuild*.jsonl.
# A model runs it with its own policy block (dexbench_arena.benchmark.model_run):
#
#   /isaac-sim/python.sh scripts/evaluation/run_benchmark_cell.py --task m2 --sweep --model <key> \
#       --output outputs/db_m2_sensitivity_<key> -- --viz none
#
# Run as it is, the file is the baseline, a pipeline check that is never scored:
#
#   /isaac-sim/python.sh scripts/evaluation/experiment_runner.py --viz none \
#       --experiment_output_directory outputs/db_m2_sensitivity_baseline \
#       --experiment_config scripts/evaluation/experiment_configs/benchmark/db_m2_sensitivity.yaml
#
# Generated from dexbench_arena.benchmark.spec (DB-M2); edit the spec, not this file.
runs:
  s2:
    environment:
      type: dexbench_manufacturing_e3_m2_environment
      embodiment: dexbench_rby1_wuji2_joint
      task: insert_connector
      anchor: A_m2
      rby1_control_hz: 30
      arm_mode: dual_arm
      m2_plug_condim: 3
      m2_fingertip_condim: 4
      m2_wire_collision: panel
      m2_wire_rest_spot: [-0.008, 0.008, 0.0872665]
      m2_connector: S2
      enable_cameras: true
      camera_scale: 0.5
      wrist_cameras: true
      episode_length_s: 70.0
      benchmark_replay: true
    environment_builder:
      presets: NEWTON
      seed: 1016
    policy:
      type: dexbench_arena.policy.hold_pose_policy.HoldPosePolicy
    recorded_variation_samples_paths: [outputs/db_conditions/db_m2_sensitivity/s2_rebuild0.jsonl, outputs/db_conditions/db_m2_sensitivity/s2_rebuild1.jsonl,
      outputs/db_conditions/db_m2_sensitivity/s2_rebuild2.jsonl, outputs/db_conditions/db_m2_sensitivity/s2_rebuild3.jsonl,
      outputs/db_conditions/db_m2_sensitivity/s2_rebuild4.jsonl, outputs/db_conditions/db_m2_sensitivity/s2_rebuild5.jsonl,
      outputs/db_conditions/db_m2_sensitivity/s2_rebuild6.jsonl, outputs/db_conditions/db_m2_sensitivity/s2_rebuild7.jsonl,
      outputs/db_conditions/db_m2_sensitivity/s2_rebuild8.jsonl, outputs/db_conditions/db_m2_sensitivity/s2_rebuild9.jsonl,
      outputs/db_conditions/db_m2_sensitivity/s2_rebuild10.jsonl, outputs/db_conditions/db_m2_sensitivity/s2_rebuild11.jsonl,
      outputs/db_conditions/db_m2_sensitivity/s2_rebuild12.jsonl, outputs/db_conditions/db_m2_sensitivity/s2_rebuild13.jsonl,
      outputs/db_conditions/db_m2_sensitivity/s2_rebuild14.jsonl, outputs/db_conditions/db_m2_sensitivity/s2_rebuild15.jsonl,
      outputs/db_conditions/db_m2_sensitivity/s2_rebuild16.jsonl, outputs/db_conditions/db_m2_sensitivity/s2_rebuild17.jsonl,
      outputs/db_conditions/db_m2_sensitivity/s2_rebuild18.jsonl, outputs/db_conditions/db_m2_sensitivity/s2_rebuild19.jsonl]
    variations:
      dexbench_tube_light:
        intensity:
          enabled: true
        color_temperature:
          enabled: true
          sampler_cfg:
            low: [2700.0]
            high: [6500.0]
      dexbench_rby1_wuji2_joint:
        camera_extrinsics_robot_pov_left_cam:
          enabled: true
          sampler_cfg:
            low: [-0.03, -0.03, -0.03]
            high: [0.03, 0.03, 0.03]
        camera_extrinsics_robot_pov_right_cam:
          enabled: true
          sampler_cfg:
            low: [-0.03, -0.03, -0.03]
            high: [0.03, 0.03, 0.03]
        camera_extrinsics_wrist_left_cam:
          enabled: true
          sampler_cfg:
            low: [-0.005, -0.005, 0.0]
            high: [0.005, 0.005, 0.005]
        camera_extrinsics_wrist_right_cam:
          enabled: true
          sampler_cfg:
            low: [-0.005, -0.005, 0.0]
            high: [0.005, 0.005, 0.005]
        base_pose:
          enabled: true
          sampler_cfg:
            low: [-0.01, -0.01, -0.0174533]
            high: [0.01, 0.01, 0.0174533]
      plug:
        tape_spot:
          enabled: true
          sampler_cfg:
            low: [-0.0108284, 0.0051716, -0.1745329]
            high: [-0.0051716, 0.0108284, 0.3490659]
