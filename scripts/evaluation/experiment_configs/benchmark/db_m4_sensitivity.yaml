# DB-M4 (E3 manufacturing, hand_start_leg at A_m4) sensitivity sweep, the +alpha robustness section (never in the score).
# Factors, uniform:
#   dexbench_tube_light.intensity: x0.25-1.5 of the tube's 60000 (DexBenchInteriorLightBase); the room's authored lights stay on
#   dexbench_tube_light.color_temperature: 2700-6500 K
#   dexbench_rby1_wuji2_joint.camera_extrinsics_robot_pov_left_cam: head camera translation, +-30 mm per axis, each camera drawn independently
#   dexbench_rby1_wuji2_joint.camera_extrinsics_robot_pov_right_cam: head camera translation, +-30 mm per axis, each camera drawn independently
#   dexbench_rby1_wuji2_joint.camera_extrinsics_wrist_left_cam: palm camera translation, x, y +-5 mm and z (optical axis) 0 to +5 mm, each camera drawn independently
#   dexbench_rby1_wuji2_joint.camera_extrinsics_wrist_right_cam: palm camera translation, x, y +-5 mm and z (optical axis) 0 to +5 mm, each camera drawn independently
# Training-range draws live as in the Train cell. Object: lg_fx25_leveling_leg.
# Unavailable at this pin (not swept, not claimed):
#   camera_intrinsics: held by choice: each camera keeps its calibrated intrinsics, which a mount change does not alter (Arena's CameraIntrinsicsVariation exists at the pin)
#   camera_rotation: CameraExtrinsicsVariation draws a translation only at the pin and on Arena main; rotation coordinates are an upstream ask
#   texture: no material or texture variation at the pin or Arena main; the smallest addition is a run-time material-swap variation of ours
#   distractors: the scene holds the leg, its holder and the cabinet on its pallet only, each part of the task
#
# Replay: the 200 recorded draws (db_m4_sensitivity_conditions.yaml), one file per build, at the benchmark cap of 115 s.
# Report: isaaclab_arena.analysis.sensitivity.generate_report on the Run's episode_results_rebuild*.jsonl.
# A model runs it with its own policy block (dexbench_arena.benchmark.model_run):
#
#   /isaac-sim/python.sh scripts/evaluation/run_benchmark_cell.py --task m4 --sweep --model <key> \
#       --output outputs/db_m4_sensitivity_<key> -- --viz none
#
# Run as it is, the file is the baseline, a pipeline check that is never scored:
#
#   /isaac-sim/python.sh scripts/evaluation/experiment_runner.py --viz none \
#       --experiment_output_directory outputs/db_m4_sensitivity_baseline \
#       --experiment_config scripts/evaluation/experiment_configs/benchmark/db_m4_sensitivity.yaml
#
# Generated from dexbench_arena.benchmark.spec (DB-M4); edit the spec, not this file.
runs:
  lg_fx25_leveling_leg:
    environment:
      type: dexbench_manufacturing_e3_environment
      embodiment: dexbench_rby1_wuji2_joint
      task: hand_start_leg
      anchor: A_m4
      rby1_control_hz: 30
      m4_leg: lg_fx25_leveling_leg
      enable_cameras: true
      camera_scale: 0.5
      wrist_cameras: true
      episode_length_s: 115.0
      benchmark_replay: true
    environment_builder:
      presets: NEWTON
      seed: 1016
    policy:
      type: dexbench_arena.policy.hold_pose_policy.HoldPosePolicy
    recorded_variation_samples_paths: [outputs/db_conditions/db_m4_sensitivity/lg_fx25_leveling_leg_rebuild0.jsonl, outputs/db_conditions/db_m4_sensitivity/lg_fx25_leveling_leg_rebuild1.jsonl,
      outputs/db_conditions/db_m4_sensitivity/lg_fx25_leveling_leg_rebuild2.jsonl, outputs/db_conditions/db_m4_sensitivity/lg_fx25_leveling_leg_rebuild3.jsonl,
      outputs/db_conditions/db_m4_sensitivity/lg_fx25_leveling_leg_rebuild4.jsonl, outputs/db_conditions/db_m4_sensitivity/lg_fx25_leveling_leg_rebuild5.jsonl,
      outputs/db_conditions/db_m4_sensitivity/lg_fx25_leveling_leg_rebuild6.jsonl, outputs/db_conditions/db_m4_sensitivity/lg_fx25_leveling_leg_rebuild7.jsonl,
      outputs/db_conditions/db_m4_sensitivity/lg_fx25_leveling_leg_rebuild8.jsonl, outputs/db_conditions/db_m4_sensitivity/lg_fx25_leveling_leg_rebuild9.jsonl,
      outputs/db_conditions/db_m4_sensitivity/lg_fx25_leveling_leg_rebuild10.jsonl, outputs/db_conditions/db_m4_sensitivity/lg_fx25_leveling_leg_rebuild11.jsonl,
      outputs/db_conditions/db_m4_sensitivity/lg_fx25_leveling_leg_rebuild12.jsonl, outputs/db_conditions/db_m4_sensitivity/lg_fx25_leveling_leg_rebuild13.jsonl,
      outputs/db_conditions/db_m4_sensitivity/lg_fx25_leveling_leg_rebuild14.jsonl, outputs/db_conditions/db_m4_sensitivity/lg_fx25_leveling_leg_rebuild15.jsonl,
      outputs/db_conditions/db_m4_sensitivity/lg_fx25_leveling_leg_rebuild16.jsonl, outputs/db_conditions/db_m4_sensitivity/lg_fx25_leveling_leg_rebuild17.jsonl,
      outputs/db_conditions/db_m4_sensitivity/lg_fx25_leveling_leg_rebuild18.jsonl, outputs/db_conditions/db_m4_sensitivity/lg_fx25_leveling_leg_rebuild19.jsonl]
    variations:
      dexbench_tube_light:
        intensity:
          enabled: true
        color_temperature:
          enabled: true
          sampler_cfg:
            low: [2700.0]
            high: [6500.0]
      dexbench_rby1_wuji2_joint:
        camera_extrinsics_robot_pov_left_cam:
          enabled: true
          sampler_cfg:
            low: [-0.03, -0.03, -0.03]
            high: [0.03, 0.03, 0.03]
        camera_extrinsics_robot_pov_right_cam:
          enabled: true
          sampler_cfg:
            low: [-0.03, -0.03, -0.03]
            high: [0.03, 0.03, 0.03]
        camera_extrinsics_wrist_left_cam:
          enabled: true
          sampler_cfg:
            low: [-0.005, -0.005, 0.0]
            high: [0.005, 0.005, 0.005]
        camera_extrinsics_wrist_right_cam:
          enabled: true
          sampler_cfg:
            low: [-0.005, -0.005, 0.0]
            high: [0.005, 0.005, 0.005]
        base_pose:
          enabled: true
          sampler_cfg:
            low: [-0.02, -0.02, 0.0]
            high: [0.02, 0.02, 0.0]
      leg:
        station_pose:
          enabled: true
          sampler_cfg:
            low: [-0.005, -0.005, 0.0]
            high: [0.005, 0.005, 0.0]
      base_cabinet:
        station_pose:
          enabled: true
          sampler_cfg:
            low: [-0.02, -0.02, 0.0]
            high: [0.02, 0.02, 0.0]
