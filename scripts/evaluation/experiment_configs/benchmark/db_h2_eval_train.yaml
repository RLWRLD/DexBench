# DB-H2 (E4 banquet hall, lift_and_pour at A_h2).
# Cell Train (train): training objects, spatial training range.
# Spatial: jug x, y +-2 cm and yaw +-10 deg, target goblet x, y +-1 cm, base x, y +-1 cm and yaw +-5 deg, each uniform and independent.
# Evaluation: each Run (an object at a spatial setting) replays its row file (60 each), the filtered rows of db_h2_conditions_train.yaml, through
# environment_builder.recorded_variation_samples_path: one episode per start-state row (120 in the cell),
# at the benchmark cap of 90 s.
# A model runs it with its own policy block (dexbench_arena.benchmark.model_run):
#
#   /isaac-sim/python.sh scripts/evaluation/run_benchmark_cell.py --task h2 --cell train --model <key> \
#       --output outputs/db_h2_eval_train_<key> -- --viz none
#
# Run as it is, the file is the baseline, a pipeline check that is never scored:
#
#   /isaac-sim/python.sh scripts/evaluation/experiment_runner.py --viz none \
#       --experiment_output_directory outputs/db_h2_eval_train_baseline \
#       --experiment_config scripts/evaluation/experiment_configs/benchmark/db_h2_eval_train.yaml
#
# Generated from dexbench_arena.benchmark.spec (DB-H2); edit the spec, not this file.
shared:
  environment:
    type: dexbench_hotel_fb_e4_pour_environment
    embodiment: dexbench_rby1_wuji2_joint
    task: lift_and_pour
    anchor: A_h2
    rby1_control_hz: 30
    idealisk_pour: true
    base_offset_y: 0.15
    pour_station_offset_y: 0.05
    start_pose: teleop_ready
    newton_nconmax: 16384
    newton_njmax: 65536
    newton_num_substeps: 8
    pour_jug_jitter_xy: 0.02
    pour_jug_jitter_yaw_deg: 10.0
    pour_goblet_jitter_xy: 0.01
    episode_length_s: 90.0
    benchmark_replay: true
  environment_builder:
    presets: NEWTON
  variations:
    dexbench_rby1_wuji2_joint:
      base_pose:
        enabled: true
        sampler_cfg:
          low: [-0.01, -0.01, -0.0872665]
          high: [0.01, 0.01, 0.0872665]
runs:
  idealisk:
    environment:
      pour_jug: idealisk
    environment_builder:
      seed: 9000
      recorded_variation_samples_path: outputs/db_conditions/db_h2_train/idealisk.jsonl
    policy:
      type: dexbench_arena.policy.hold_pose_policy.HoldPosePolicy
  d00527_x15:
    environment:
      pour_jug: d00527_x15
    environment_builder:
      seed: 9001
      recorded_variation_samples_path: outputs/db_conditions/db_h2_train/d00527_x15.jsonl
    policy:
      type: dexbench_arena.policy.hold_pose_policy.HoldPosePolicy
