# DB-H1 (E4 banquet hall, stack_plates at A_h1) sensitivity sweep, the +alpha robustness section (never in the score).
# Factors, uniform:
#   dexbench_hotel_fb_e4_lighting.intensity_scale: x0.25-1.5 of the delivered lights (LIGHT_INTENSITY_SCALE_RANGE)
#   dexbench_hotel_fb_e4_lighting.color_temperature: 3000-9000 K (LIGHT_COLOR_TEMPERATURE_RANGE_K)
#   dexbench_rby1_wuji2_joint.camera_extrinsics_robot_pov_left_cam: head camera translation, +-30 mm per axis, each camera drawn independently
#   dexbench_rby1_wuji2_joint.camera_extrinsics_robot_pov_right_cam: head camera translation, +-30 mm per axis, each camera drawn independently
#   dexbench_rby1_wuji2_joint.camera_extrinsics_wrist_left_cam: palm camera translation, x, y +-5 mm and z (optical axis) 0 to +5 mm, each camera drawn independently
#   dexbench_rby1_wuji2_joint.camera_extrinsics_wrist_right_cam: palm camera translation, x, y +-5 mm and z (optical axis) 0 to +5 mm, each camera drawn independently
# Training-range draws live as in the Train cell. Object: harmynta_deep_plate_22.
# Unavailable at this pin (not swept, not claimed):
#   camera_intrinsics: held by choice: each camera keeps its calibrated intrinsics, which a mount change does not alter (Arena's CameraIntrinsicsVariation exists at the pin)
#   camera_rotation: CameraExtrinsicsVariation draws a translation only at the pin and on Arena main; rotation coordinates are an upstream ask
#   texture: no material or texture variation at the pin or Arena main; the smallest addition is a run-time material-swap variation of ours
#   distractors: every rigid object on the tables is a dish of the task
#
# Replay: the 200 recorded draws (db_h1_sensitivity_conditions.yaml), one file per build, at the benchmark cap of 55 s.
# Report: isaaclab_arena.analysis.sensitivity.generate_report on the Run's episode_results_rebuild*.jsonl.
# A model runs it with its own policy block (dexbench_arena.benchmark.model_run):
#
#   /isaac-sim/python.sh scripts/evaluation/run_benchmark_cell.py --task h1 --sweep --model <key> \
#       --output outputs/db_h1_sensitivity_<key> -- --viz none
#
# Run as it is, the file is the baseline, a pipeline check that is never scored:
#
#   /isaac-sim/python.sh scripts/evaluation/experiment_runner.py --viz none \
#       --experiment_output_directory outputs/db_h1_sensitivity_baseline \
#       --experiment_config scripts/evaluation/experiment_configs/benchmark/db_h1_sensitivity.yaml
#
# Generated from dexbench_arena.benchmark.spec (DB-H1); edit the spec, not this file.
runs:
  harmynta_deep_plate_22:
    environment:
      type: dexbench_hotel_fb_e4_environment
      embodiment: dexbench_rby1_wuji2_joint
      task: stack_plates
      anchor: A_h1
      rby1_control_hz: 30
      hide_replay_prims: true
      stack_alignment_point: rim
      success_follows_dest_draw: true
      plate_variant: harmynta_deep_plate_22
      enable_cameras: true
      camera_scale: 0.5
      wrist_cameras: true
      episode_length_s: 55.0
      benchmark_replay: true
    environment_builder:
      presets: NEWTON
      seed: 1016
    policy:
      type: dexbench_arena.policy.hold_pose_policy.HoldPosePolicy
    recorded_variation_samples_paths: [outputs/db_conditions/db_h1_sensitivity/harmynta_deep_plate_22_rebuild0.jsonl, outputs/db_conditions/db_h1_sensitivity/harmynta_deep_plate_22_rebuild1.jsonl,
      outputs/db_conditions/db_h1_sensitivity/harmynta_deep_plate_22_rebuild2.jsonl, outputs/db_conditions/db_h1_sensitivity/harmynta_deep_plate_22_rebuild3.jsonl,
      outputs/db_conditions/db_h1_sensitivity/harmynta_deep_plate_22_rebuild4.jsonl, outputs/db_conditions/db_h1_sensitivity/harmynta_deep_plate_22_rebuild5.jsonl,
      outputs/db_conditions/db_h1_sensitivity/harmynta_deep_plate_22_rebuild6.jsonl, outputs/db_conditions/db_h1_sensitivity/harmynta_deep_plate_22_rebuild7.jsonl,
      outputs/db_conditions/db_h1_sensitivity/harmynta_deep_plate_22_rebuild8.jsonl, outputs/db_conditions/db_h1_sensitivity/harmynta_deep_plate_22_rebuild9.jsonl,
      outputs/db_conditions/db_h1_sensitivity/harmynta_deep_plate_22_rebuild10.jsonl, outputs/db_conditions/db_h1_sensitivity/harmynta_deep_plate_22_rebuild11.jsonl,
      outputs/db_conditions/db_h1_sensitivity/harmynta_deep_plate_22_rebuild12.jsonl, outputs/db_conditions/db_h1_sensitivity/harmynta_deep_plate_22_rebuild13.jsonl,
      outputs/db_conditions/db_h1_sensitivity/harmynta_deep_plate_22_rebuild14.jsonl, outputs/db_conditions/db_h1_sensitivity/harmynta_deep_plate_22_rebuild15.jsonl,
      outputs/db_conditions/db_h1_sensitivity/harmynta_deep_plate_22_rebuild16.jsonl, outputs/db_conditions/db_h1_sensitivity/harmynta_deep_plate_22_rebuild17.jsonl,
      outputs/db_conditions/db_h1_sensitivity/harmynta_deep_plate_22_rebuild18.jsonl, outputs/db_conditions/db_h1_sensitivity/harmynta_deep_plate_22_rebuild19.jsonl]
    variations:
      dexbench_hotel_fb_e4_lighting:
        intensity_scale:
          enabled: true
        color_temperature:
          enabled: true
      dexbench_rby1_wuji2_joint:
        camera_extrinsics_robot_pov_left_cam:
          enabled: true
          sampler_cfg:
            low: [-0.03, -0.03, -0.03]
            high: [0.03, 0.03, 0.03]
        camera_extrinsics_robot_pov_right_cam:
          enabled: true
          sampler_cfg:
            low: [-0.03, -0.03, -0.03]
            high: [0.03, 0.03, 0.03]
        camera_extrinsics_wrist_left_cam:
          enabled: true
          sampler_cfg:
            low: [-0.005, -0.005, 0.0]
            high: [0.005, 0.005, 0.005]
        camera_extrinsics_wrist_right_cam:
          enabled: true
          sampler_cfg:
            low: [-0.005, -0.005, 0.0]
            high: [0.005, 0.005, 0.005]
        base_pose:
          enabled: true
          sampler_cfg:
            low: [-0.021, -0.021, -0.0872665]
            high: [0.021, 0.021, 0.0872665]
      table_plate_00:
        source_stack_pose:
          enabled: true
          sampler_cfg:
            low: [-0.021, -0.021, 0.0]
            high: [0.021, 0.021, 0.0]
      clearing_plate_00:
        dest_stack_pose:
          enabled: true
          sampler_cfg:
            low: [-0.021, -0.021, 0.0]
            high: [0.021, 0.021, 0.0]
