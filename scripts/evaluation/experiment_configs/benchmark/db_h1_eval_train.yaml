        enabled: true
        sampler_cfg:
          low: [-0.03, -0.03, 0.0]
          high: [0.03, 0.03, 0.0]
    clearing_plate_00:
      dest_stack_pose:
        enabled: true
        sampler_cfg:
          low: [-0.03, -0.03, 0.0]
          high: [0.03, 0.03, 0.0]
