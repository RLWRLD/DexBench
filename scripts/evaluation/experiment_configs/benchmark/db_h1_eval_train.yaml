shared:
  environment:
    type: dexbench_hotel_fb_e4_environment
    embodiment: dexbench_rby1_wuji2_joint
    task: stack_plates
    anchor: A_h1
    rby1_control_hz: 30
    hide_replay_prims: true
    stack_alignment_point: rim
    success_follows_dest_draw: true
    episode_length_s: 55.0
    benchmark_replay: true
  environment_builder:
    presets: NEWTON
  variations:
    dexbench_rby1_wuji2_joint:
      base_pose:
        enabled: true
        sampler_cfg:
          low: [-0.03, -0.03, -0.0872665]
          high: [0.03, 0.03, 0.0872665]
