# DB-M1 (E3 manufacturing, tabletop pick_insert_drawer at A_m1) sensitivity sweep, the +alpha robustness section (never in the score).
# Factors, uniform:
#   dexbench_tube_light.intensity: x0.25-1.5 of the tube's 60000 (DexBenchInteriorLightBase); the room's authored lights stay on
#   dexbench_tube_light.color_temperature: 2700-6500 K
#   dexbench_rby1_wuji2_joint.camera_extrinsics_robot_pov_left_cam: head camera translation, +-30 mm per axis, each camera drawn independently
#   dexbench_rby1_wuji2_joint.camera_extrinsics_robot_pov_right_cam: head camera translation, +-30 mm per axis, each camera drawn independently
#   dexbench_rby1_wuji2_joint.camera_extrinsics_wrist_left_cam: palm camera translation, x, y +-5 mm and z (optical axis) 0 to +5 mm, each camera drawn independently
#   dexbench_rby1_wuji2_joint.camera_extrinsics_wrist_right_cam: palm camera translation, x, y +-5 mm and z (optical axis) 0 to +5 mm, each camera drawn independently
# Training-range draws live as in the Train cell. Object: lg_fh25eae_detergent_drawer.
# Unavailable at this pin (not swept, not claimed):
#   camera_intrinsics: held by choice: each camera keeps its calibrated intrinsics, which a mount change does not alter (Arena's CameraIntrinsicsVariation exists at the pin)
#   camera_rotation: CameraExtrinsicsVariation draws a translation only at the pin and on Arena main; rotation coordinates are an upstream ask
#   texture: no material or texture variation at the pin or Arena main; the smallest addition is a run-time material-swap variation of ours
#   distractors: the scene holds the washer and the drawer only
#
# Replay: the 200 recorded draws (db_m1_sensitivity_conditions.yaml), one file per build, at the benchmark cap of 100 s.
# Report: isaaclab_arena.analysis.sensitivity.generate_report on the Run's episode_results_rebuild*.jsonl.
# A model runs it with its own policy block (dexbench_arena.benchmark.model_run):
#
#   /isaac-sim/python.sh scripts/evaluation/run_benchmark_cell.py --task m1 --sweep --model <key> \
#       --output outputs/db_m1_sensitivity_<key> -- --viz none
#
# Run as it is, the file is the baseline, a pipeline check that is never scored:
#
#   /isaac-sim/python.sh scripts/evaluation/experiment_runner.py --viz none \
#       --experiment_output_directory outputs/db_m1_sensitivity_baseline \
#       --experiment_config scripts/evaluation/experiment_configs/benchmark/db_m1_sensitivity.yaml
#
# Generated from dexbench_arena.benchmark.spec (DB-M1); edit the spec, not this file.
runs:
  lg_fh25eae_detergent_drawer:
    environment:
      type: dexbench_manufacturing_e3_m1_environment
      embodiment: dexbench_rby1_wuji2_joint
      task: pick_insert_drawer
      anchor: A_m1
      start_pose: teleop_ready
      m1_tabletop_base_xy: [0.15, -0.9757]
      m1_tabletop_base_yaw_deg: 180.0
      m1_tabletop_crouch_deg: 55.0
      m1_tabletop_drawer_mass_kg: 0.55
      m1_physics_profile: damped_contacts
      rby1_control_hz: 30
      camera_hz: 30
      m1_drawer: lg_fh25eae_detergent_drawer
      enable_cameras: true
      camera_scale: 0.5
      wrist_cameras: true
      episode_length_s: 100.0
      benchmark_replay: true
    environment_builder:
      presets: NEWTON
      seed: 1016
    policy:
      type: dexbench_arena.policy.hold_pose_policy.HoldPosePolicy
    recorded_variation_samples_paths: [outputs/db_conditions/db_m1_tabletop_sensitivity/lg_fh25eae_detergent_drawer_rebuild0.jsonl,
      outputs/db_conditions/db_m1_tabletop_sensitivity/lg_fh25eae_detergent_drawer_rebuild1.jsonl, outputs/db_conditions/db_m1_tabletop_sensitivity/lg_fh25eae_detergent_drawer_rebuild2.jsonl,
      outputs/db_conditions/db_m1_tabletop_sensitivity/lg_fh25eae_detergent_drawer_rebuild3.jsonl, outputs/db_conditions/db_m1_tabletop_sensitivity/lg_fh25eae_detergent_drawer_rebuild4.jsonl,
      outputs/db_conditions/db_m1_tabletop_sensitivity/lg_fh25eae_detergent_drawer_rebuild5.jsonl, outputs/db_conditions/db_m1_tabletop_sensitivity/lg_fh25eae_detergent_drawer_rebuild6.jsonl,
      outputs/db_conditions/db_m1_tabletop_sensitivity/lg_fh25eae_detergent_drawer_rebuild7.jsonl, outputs/db_conditions/db_m1_tabletop_sensitivity/lg_fh25eae_detergent_drawer_rebuild8.jsonl,
      outputs/db_conditions/db_m1_tabletop_sensitivity/lg_fh25eae_detergent_drawer_rebuild9.jsonl, outputs/db_conditions/db_m1_tabletop_sensitivity/lg_fh25eae_detergent_drawer_rebuild10.jsonl,
      outputs/db_conditions/db_m1_tabletop_sensitivity/lg_fh25eae_detergent_drawer_rebuild11.jsonl, outputs/db_conditions/db_m1_tabletop_sensitivity/lg_fh25eae_detergent_drawer_rebuild12.jsonl,
      outputs/db_conditions/db_m1_tabletop_sensitivity/lg_fh25eae_detergent_drawer_rebuild13.jsonl, outputs/db_conditions/db_m1_tabletop_sensitivity/lg_fh25eae_detergent_drawer_rebuild14.jsonl,
      outputs/db_conditions/db_m1_tabletop_sensitivity/lg_fh25eae_detergent_drawer_rebuild15.jsonl, outputs/db_conditions/db_m1_tabletop_sensitivity/lg_fh25eae_detergent_drawer_rebuild16.jsonl,
      outputs/db_conditions/db_m1_tabletop_sensitivity/lg_fh25eae_detergent_drawer_rebuild17.jsonl, outputs/db_conditions/db_m1_tabletop_sensitivity/lg_fh25eae_detergent_drawer_rebuild18.jsonl,
      outputs/db_conditions/db_m1_tabletop_sensitivity/lg_fh25eae_detergent_drawer_rebuild19.jsonl]
    variations:
      dexbench_tube_light:
        intensity:
          enabled: true
        color_temperature:
          enabled: true
          sampler_cfg:
            low: [2700.0]
            high: [6500.0]
      dexbench_rby1_wuji2_joint:
        camera_extrinsics_robot_pov_left_cam:
          enabled: true
          sampler_cfg:
            low: [-0.03, -0.03, -0.03]
            high: [0.03, 0.03, 0.03]
        camera_extrinsics_robot_pov_right_cam:
          enabled: true
          sampler_cfg:
            low: [-0.03, -0.03, -0.03]
            high: [0.03, 0.03, 0.03]
        camera_extrinsics_wrist_left_cam:
          enabled: true
          sampler_cfg:
            low: [-0.005, -0.005, 0.0]
            high: [0.005, 0.005, 0.005]
        camera_extrinsics_wrist_right_cam:
          enabled: true
          sampler_cfg:
            low: [-0.005, -0.005, 0.0]
            high: [0.005, 0.005, 0.005]
        base_pose:
          enabled: true
          sampler_cfg:
            low: [0.0, 0.0, 0.0]
            high: [0.0, 0.0, 0.0]
      drawer:
        pose:
          enabled: true
          sampler_cfg:
            low: [0.0, 0.0, 0.0]
            high: [0.0, 0.0, 0.0]
      washer:
        pose:
          enabled: true
          sampler_cfg:
            low: [0.0, 0.0, 0.0]
            high: [0.0, 0.0, 0.0]
