# DB-H2 (E4 banquet hall, lift_and_pour at A_h2).
# Cell GA-OS (ga_os): held-out objects, spatial beyond the training range.
# Spatial: one axis fixed off its training range and every other at its training draw: the jug 4 cm toward world e, ne, n, nw, sw and se and 3 cm toward w and s (at 4 cm the IDEALISK spout meets a goblet drawn toward w, and a grasp knocks the jug over toward the robot); or the jug turned -15 or +15 deg; or the base 2 cm toward each of the eight, turned at its draw; or the base turned +7 or -7 deg; or the goblet 2 cm toward each of the eight. Every point lies outside the training box on its axis and is checked at the 1.90 m base with every other axis at its training extremes, all four jugs: the placement on the trolley, the base >= 17 mm from the trolley's columns and the curtain, the wrist poses within the arm's reach, and the start at rest on Newton with no hand touching a prop.
# Evaluation: each Run (an object at a spatial setting) replays its row file (1 or 2 or 6 each, as the spec's row_quotas declare), the filtered rows of db_h2_conditions_ga_os.yaml, through
# environment_builder.recorded_variation_samples_path: one episode per start-state row (120 in the cell),
# at the benchmark cap of 90 s.
# A model runs it with its own policy block (dexbench_arena.benchmark.model_run):
#
#   /isaac-sim/python.sh scripts/evaluation/run_benchmark_cell.py --task h2 --cell ga_os --model <key> \
#       --output outputs/db_h2_eval_ga_os_<key> -- --viz none
#
# Run as it is, the file is the baseline, a pipeline check that is never scored:
#
#   /isaac-sim/python.sh scripts/evaluation/experiment_runner.py --viz none \
#       --experiment_output_directory outputs/db_h2_eval_ga_os_baseline \
#       --experiment_config scripts/evaluation/experiment_configs/benchmark/db_h2_eval_ga_os.yaml
#
# Generated from dexbench_arena.benchmark.spec (DB-H2); edit the spec, not this file.
shared:
  environment:
    type: dexbench_hotel_fb_e4_pour_environment
    embodiment: dexbench_rby1_wuji2_joint
