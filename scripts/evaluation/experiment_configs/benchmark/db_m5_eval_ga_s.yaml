# DB-M5 (E3 manufacturing, place_part_in_kit_box at A_m5).
# Cell GA-S (ga_s): training objects, spatial beyond the training range.
# Spatial: the other diagonal: the near-right or the far-left compartment empty (kit_box_empty_compartments [1, 2]), no demo of which exists, at the same piles, so a GA-S row differs from a Train start in the compartment alone; each range has one near and one far, one left and one right compartment.
# Evaluation: each Run (an object at a spatial setting) replays its row file (24 each), frozen rows (each part of the cell's split an even share of the 120 rows (Train and GA-S 24, GA-O and GA-OS 12), spread over the range's two compartments and the 24 piles by a fixed rule (row i: compartment i mod 2, pile of rank floor(24 i / n)), outcome-blind; written, not recorded, because a condition recording's settle check fails on the kit box the belt carries), through
# environment_builder.recorded_variation_samples_path: one episode per start-state row (120 in the cell),
# at the benchmark cap of 30 s.
# A model runs it with its own policy block (dexbench_arena.benchmark.model_run):
#
#   /isaac-sim/python.sh scripts/evaluation/run_benchmark_cell.py --task m5 --cell ga_s --model <key> \
#       --output outputs/db_m5_eval_ga_s_<key> -- --viz none
#
# Run as it is, the file is the baseline, a pipeline check that is never scored:
#
#   /isaac-sim/python.sh scripts/evaluation/experiment_runner.py --viz none \
#       --experiment_output_directory outputs/db_m5_eval_ga_s_baseline \
#       --experiment_config scripts/evaluation/experiment_configs/benchmark/db_m5_eval_ga_s.yaml
#
# Generated from dexbench_arena.benchmark.spec (DB-M5); edit the spec, not this file.
shared:
  environment:
    type: dexbench_manufacturing_m5_moving_conveyor_kitting_environment
    embodiment: dexbench_rby1_wuji2_joint
    task: place_part_in_kit_box
    anchor: A_m5
    rby1_control_hz: 30
    arm_mode: left
    parts_bin_clutter_dir: outputs/db_conditions/db_m5_piles
    kit_box_empty_compartments: [1, 2]
    parts_bin_seed_quantiles: [0.0, 0.6]
    episode_length_s: 30.0
    benchmark_replay: true
  environment_builder:
    presets: NEWTON
