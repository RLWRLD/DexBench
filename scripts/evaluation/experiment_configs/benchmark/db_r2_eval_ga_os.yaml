# DB-R2 (retail_v1, retrieve_beverage_from_clutter at the Fridge anchor).
# Cell GA-OS (ga_os): held-out objects, spatial beyond the training range.
# Spatial: the target in MF3, MF4 or MF5 and the base fixed 4 cm out, toward e, w, sw, s and se, turned at its training draw on the left and at most 0.5 deg right (R2_YAW_RING_DEG); n, ne and nw are out, since the fingers meet fridge_01/02 or the door frame at reset from teleop_home on every lane. At MF3, IK reaches TC2's grasp poses from s and se, with nominal joint-limit margins. GA-OS's held-out drinks are reach-checked at MF4 only: at MF3 and MF5 the settle filter guards their starts, but reach is unverified. Or the base at its training x, y draw and turned 6 deg left (base_yaw_p6) or 4 deg right (base_yaw_m4), reach-checked on every lane (R2_YAW_* says why the right side is narrower).
# Evaluation: each Run (an object at a spatial setting) replays its row file (1 or 2 each, as the spec's row_quotas declare), the filtered rows of db_r2_conditions_ga_os.yaml, through
# environment_builder.recorded_variation_samples_path: one episode per start-state row (120 in the cell),
# at the benchmark cap of 35 s.
# A model runs it with its own policy block (dexbench_arena.benchmark.model_run):
#
#   /isaac-sim/python.sh scripts/evaluation/run_benchmark_cell.py --task r2 --cell ga_os --model <key> \
#       --output outputs/db_r2_eval_ga_os_<key> -- --viz none
#
# Run as it is, the file is the baseline, a pipeline check that is never scored:
#
#   /isaac-sim/python.sh scripts/evaluation/experiment_runner.py --viz none \
#       --experiment_output_directory outputs/db_r2_eval_ga_os_baseline \
#       --experiment_config scripts/evaluation/experiment_configs/benchmark/db_r2_eval_ga_os.yaml
#
