# Per-part metadata for 'wujihand2_beta2' (hand). computed.* is read from the MJCF.

canonical_format: mjcf
name: wujihand2_beta2
kind: hand
sides:
- left
- right
vendor:
  source: wuji-technology/wuji-description (hand2/hand2_beta2/body/)
  version: v2026.8.14 (06e5f14cdd1d5fad0a666ca463a668bf609f9534) + in-house
    wrist_adapter/mount_flange geoms carried over unchanged from the wujihand2 part
    (STEP-derived; the palm mounting interface is byte-identical between Beta 1 and
    Beta 2 per the vendor changelog)
  license: MIT (Copyright (c) 2025 Wuji Technology); in-house mount geoms rlwrld internal
formats:
  mjcf: vendor + in-house mount geoms, side-neutralized (r_/l_ prefixes stripped;
