  urdf: vendor (no mount geoms)
  usd: vendor (layered, no mount geoms)
attach_note: mount_flange mating face is NOT normal to wrist z - measured normal
  [0.032809, +/-0.0005, 0.999462] (1.88 deg tilt, y sign flips left/right), plane
  offset 0.0285 m; fingers extend -z, thumb side +x, palm faces +y (right hand).
  Wrist inertial is the vendor's bare-hand value - adapter/flange mass not included.
  Actuator kp/kv carried over from Wuji Hand 1 calibration (vendor sysid pending).
beta2_note: Beta 1 + one tactile-sensor pad link per fingertip
  ({p}_{finger}_tip_sensor_frame, welded, thumb 6.3 g / others 3.0 g each; distal
  masses re-measured to match). Joint contract unchanged from Beta 1 - same 20
  revolute joints, identical axes; fingertip sites carried over.
